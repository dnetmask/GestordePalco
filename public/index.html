<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Palco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de acceso -->
  <section id="login" class="login">
    <h1 class="brand">PAL<br>CO.</h1>
    <form id="login-form" class="card">
      <p class="eyebrow" id="palco-name">Palco DaviArena</p>
      <h2>Ingresa con el código de tu empresa</h2>
      <input id="code" type="password" autocomplete="off" placeholder="Código de socio" required>
      <button type="submit" class="btn">Entrar</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </section>

  <!-- Aplicación -->
  <div id="app" hidden>
    <header class="topbar">
      <span class="logo">PALCO.</span>
      <nav>
        <button class="tab active" data-view="reservas">Reservas</button>
        <button class="tab" data-view="stats">Estadísticas</button>
        <button class="tab" data-view="historial">Historial</button>
        <button class="tab admin-only" data-view="admin" hidden>Conciertos</button>
      </nav>
      <span id="whoami" class="who"></span>
      <button id="logout" class="link">Salir</button>
    </header>

    <main>
      <!-- Reservas -->
      <section id="view-reservas" class="view">
        <aside class="concerts">
          <h2>La Primavera</h2>
          <label class="toggle"><input type="checkbox" id="show-past"> Mostrar pasados</label>
          <ul id="concert-list"></ul>
        </aside>
        <article class="palco" id="palco">
          <p class="empty">Selecciona un concierto.</p>
        </article>
      </section>

      <!-- Estadísticas -->
      <section id="view-stats" class="view" hidden></section>

      <!-- Historial -->
      <section id="view-historial" class="view" hidden>
        <div class="card wide">
          <h2>Historial de movimientos</h2>
          <table class="table"><thead><tr><th>Fecha</th><th>Socio</th><th>Acción</th><th>Concierto</th><th>Detalle</th></tr></thead>
          <tbody id="activity"></tbody></table>
        </div>
      </section>

      <!-- Administración -->
      <section id="view-admin" class="view" hidden>
        <div class="card wide">
          <h2>Conciertos</h2>
          <form id="concert-form" class="inline-form">
            <input type="hidden" id="cf-id">
            <input id="cf-artist" placeholder="Artista" required>
            <input id="cf-date" type="date" required>
            <input id="cf-notes" placeholder="Notas (opcional)">
            <button class="btn" type="submit" id="cf-submit">Agregar</button>
            <button class="link" type="button" id="cf-cancel" hidden>Cancelar</button>
          </form>
          <table class="table"><thead><tr><th>Fecha</th><th>Artista</th><th>Notas</th><th>Ocupación</th><th></th></tr></thead>
          <tbody id="admin-concerts"></tbody></table>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
